name: publish

# The graphlink crates go to crates.io when a GitHub release is published (the tag is `v<version>`, the one version of every crate: Cargo.toml [workspace.package]).
#   1. bump `version` in [workspace.package] and the four `version` of [workspace.dependencies] to X.Y.Z, merge
#   2. publish a GitHub release with the tag vX.Y.Z (a pre-release publishes nothing)
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token with the scopes publish-new and publish-update). On every push and pull request only the dry run runs: it packages and
# builds every crate as crates.io would receive it, in dependency order, and uploads nothing.
on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the tag is the version of every crate
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          versions=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print("\n".join(sorted({p["version"] for p in json.load(sys.stdin)["packages"]})))')
          if [ "$versions" != "${TAG#v}" ]; then echo "::error::the tag is $TAG but the crates are at: $versions (they must all be ${TAG#v})"; exit 1; fi
      - run: cargo test --workspace
      - name: publish, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          cargo publish --workspace
