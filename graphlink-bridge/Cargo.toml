[package]
name = "graphlink-bridge"
version.workspace = true
edition.workspace = true
description = "graphlink-bridge: TCP outward, shared memory inward: joins a seat to a remote peer without a socket in the seat"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "graphlink-bridge"
path = "src/main.rs"

[dependencies]
graphlink-core = { workspace = true }
graphlink-net = { workspace = true, features = ["tls"] }
graphlink-auth = { workspace = true }
graphlink-shm = { workspace = true }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

