[package]
name = "graphlink-cli"
version.workspace = true
edition.workspace = true
description = "graphlink: serve a few nodes, watch them, write one (a debugging tool and a demo peer for graphlink-core)"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "graphlink"
path = "src/main.rs"

[dependencies]
graphlink-core = { workspace = true }
graphlink-net = { workspace = true, features = ["tls"] }
graphlink-auth = { workspace = true }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
