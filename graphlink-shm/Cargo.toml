[package]
name = "graphlink-shm"
version = "0.0.1"
edition = "2021"
description = "A shared-memory transport for graphlink-core: two single-producer rings in a mapped file, no dependency"
license = "MIT"
publish = false

[dependencies]
graphlink-core = { path = "../graphlink-core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
