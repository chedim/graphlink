[package]
name = "graphlink-net"
version.workspace = true
edition.workspace = true
description = "A TCP transport for graphlink-core: one JSON frame per line, non-blocking"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
graphlink-core = { workspace = true }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[features]
# TLS for the transport (rustls, with ring) and a maker of a small CA and a certificate for a listener (rcgen)
tls = ["dep:rustls", "dep:rcgen"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
optional = true

[dependencies.rcgen]
version = "0.14.10"
default-features = false
features = ["ring", "pem"]
optional = true
